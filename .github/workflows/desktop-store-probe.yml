name: Desktop store probe

# Once, on this branch only: the Mac app with the Mac App Store's App Sandbox (desktop/mac/store-entitlements.plist), ad hoc
# signed, used as desktop.yml uses it, with the app's folders in its container (desktop/smoke/store.py). What the sandbox
# denied is kept from the unified log. No secrets, no signing identity.
on:
  push:
    branches: [desktop-store-probe]

permissions:
  contents: read

jobs:
  mac-store:
    runs-on: macos-26
    timeout-minutes: 100
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, in the App Sandbox
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo +stable build --release --locked --features sandbox
          mac/bundle.sh sandbox-build target/release/the-machine-desktop
          cargo +stable build --release --locked
          mac/bundle.sh out target/release/the-machine-desktop
          for app in "sandbox-build/The Machine.app" "out/The Machine.app"; do
            codesign --force --sign - --options runtime --entitlements mac/store-entitlements.plist --timestamp=none "$app"
            codesign --verify --strict --verbose=2 "$app"
            codesign -d --entitlements :- "$app"
          done
      - name: Use it, with a made-up Machine
        id: use
        timeout-minutes: 70
        run: |
          date '+%Y-%m-%d %H:%M:%S' > "$RUNNER_TEMP/start"
          certificate="$RUNNER_TEMP/certificate" system=/Library/Keychains/System.keychain
          smoke/certificate.sh "$certificate"
          trap 'sudo security delete-certificate -c "Made-up Machine root" "$system"' EXIT
          sudo security add-trusted-cert -d -r trustRoot -p ssl -k "$system" "$certificate/root.pem"
          failed=0
          python3 smoke/store.py probe "out/The Machine.app" shots/probe || failed=1
          python3 smoke/store.py run smoke/mac.py "sandbox-build/The Machine.app" "out/The Machine.app" shots "$certificate" || failed=1
          python3 smoke/store.py run smoke/window.py "sandbox-build/The Machine.app" "out/The Machine.app" shots/window "$certificate" || failed=1
          python3 smoke/store.py run smoke/hangs.py "sandbox-build/The Machine.app" - shots/hangs || failed=1
          exit $failed
      - name: What the sandbox denied
        if: always() && steps.use.outcome != 'skipped'
        run: |
          mkdir -p shots
          log show --start "$(cat "$RUNNER_TEMP/start")" --style compact --info --debug \
            --predicate 'eventMessage CONTAINS "Sandbox: " AND eventMessage CONTAINS " deny("' > shots/sandbox-denials.txt || true
          python3 smoke/store.py denials shots/sandbox-denials.txt || true
          cp ~/Library/Logs/DiagnosticReports/the-machine-desktop* shots/ 2>/dev/null || true
      - name: Its certificate is trusted no more
        if: always() && steps.use.outcome != 'skipped'
        run: if security verify-cert -c "$RUNNER_TEMP/certificate/cert.pem" -p ssl -s 127.0.0.1 -L; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: the-machine-desktop-mac-store-probe
          path: desktop/shots/
          retention-days: 14
