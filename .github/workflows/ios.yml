name: iOS app build

# The iOS app (mobile/, see mobile/README.md) only builds on a Mac, and macOS minutes cost 10x Linux ones. So this runs
# only when someone starts it by hand (Actions, iOS app build, Run workflow): never on a pull request or a push.
# Without "upload" it builds for the simulator without signing, to check the native code compiles. With "upload" it
# archives a signed build and sends it to TestFlight instead (one run, not two): Xcode's automatic signing through the
# App Store Connect API key in the repo secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID. The build
# number is the run number, so each upload is new. The development certificate signing makes on the runner is revoked
# at the end, so they never reach Apple's limit.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Archive a signed build and upload it to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26  # Xcode 26: App Store Connect takes only builds made with the iOS 26 SDK or later
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Xcode
        run: xcodebuild -version
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm test
          npm run cap -- sync ios
      - name: Build for the simulator
        if: ${{ !inputs.upload }}
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload && github.repository == 'Salesflare/TheMachine' }}
        working-directory: mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/asc-key.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          trap 'rm -f "$key"' EXIT
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${auth[@]}" archive | tail -n 60
          # The app and both extensions are in the archive, each signed with the shared app group, before anything uploads
          app="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          for b in "$app" "$app/PlugIns/ShareExtension.appex" "$app/PlugIns/NotificationService.appex"; do
            [ -d "$b" ] || { echo "::error::not in the archive: ${b##*/}"; exit 1; }
            codesign -d --entitlements - --xml "$b" 2>/dev/null | grep -q '<string>group.computer.themachine.app</string>' \
              || { echo "::error::${b##*/} is signed without group.computer.themachine.app"; exit 1; }
            echo "${b##*/}: in the archive, with group.computer.themachine.app"
          done
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}" | tail -n 40
      - name: Revoke this run's development certificate
        # Each archive on a fresh runner makes a new development certificate whose key leaves with the runner; without
        # this they reach Apple's limit and the next upload fails.
        if: ${{ always() && inputs.upload && github.repository == 'Salesflare/TheMachine' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/asc-key-revoke.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          trap 'rm -f "$key"' EXIT
          ASC_KEY_FILE="$key" node .github/scripts/asc-revoke-ci-dev-certs.mjs
