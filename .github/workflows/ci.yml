name: Tests and privacy checks

on:
  # GitHub Actions minutes cost money (macOS 10x, Windows 2x Linux), and the full suite runs locally before every push.
  # So a pull request gets one Linux run of the pinned versions. Main, the merge queue and release tags run nothing here
  # (the required check is Aikido's). The full matrix, Windows and macOS run weekly and on demand.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'  # weekly, so a new OpenClaw release that breaks something shows up here

permissions:
  contents: read

# A new push to a pull request cancels its run still going: only the newest commit can be merged anyway.
# The weekly run is never canceled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests run on our own runner (a Hetzner server, one fresh runner per job; the themachine-cloud repo's
# docs/operations.md, CI runner), so they cost no Actions minutes. The weekly and manual runs stay on GitHub's.
# To fall back to GitHub's runners for pull requests too, set the repository variable CI_PR_RUNNER to "ubuntu-24.04"
# (with the quotes); unset it to go back.
jobs:
  tests:
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON(vars.CI_PR_RUNNER || '["self-hosted","linux","themachine-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs the pinned versions only; the weekly run and a manual run add the newest Python, Node and OpenClaw.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"python":"3.12","node":"24.22.1","openclaw":"2026.10.7"}]' || '[{"python":"3.12","node":"24.22.1","openclaw":"2026.10.7"},{"python":"3.14","node":"26","openclaw":"latest"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install OpenClaw and browser
        run: |
          npm install --global openclaw@${{ matrix.openclaw }}
          # our runner has Chromium's system libraries already, and a job there has no sudo
          npx --yes --package=playwright@1.63.0 playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
          printf 'OPENCLAW_PACKAGE_DIR=%s/openclaw\n' "$(npm root -g)" >> "$GITHUB_ENV"
      - name: Install the pinned Node packages
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Select Chromium
        run: |
          node --input-type=module -e 'const {chromium}=await import(process.env.OPENCLAW_PACKAGE_DIR+"/node_modules/playwright-core/index.mjs"); console.log("CHROMIUM_PATH="+chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Test Python, Node, OpenClaw SDK and dashboard
        run: python3 scripts/test.py
      - name: Check whitespace
        run: git diff --check

  help:
    # The help articles (docs/help/, the help at themachine.computer/help) against the code: every connector, dashboard
    # tab and Settings tab has one, and each names only buttons, routes and commands that still exist.
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON(vars.CI_PR_RUNNER || '["self-hosted","linux","themachine-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the help articles
        run: python3 scripts/help_check.py

  portable:
    # macOS runs natively under launchd; Windows runs The Machine inside WSL2 (Linux), so this checks the portable core.
    # Weekly and on demand only: these runners cost 2x (Windows) and 10x (macOS) a Linux minute.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Time zones for Python on Windows (Linux and macOS have them built in)
        if: runner.os == 'Windows'
        run: python -m pip install --quiet tzdata
      - name: Install OpenClaw and browser
        run: |
          npm install --global openclaw@2026.10.7
          npx --yes --package=playwright@1.63.0 playwright install chromium
          printf 'OPENCLAW_PACKAGE_DIR=%s/openclaw\n' "$(npm root -g)" >> "$GITHUB_ENV"
      - name: Install the pinned Node packages
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Select Chromium
        run: |
          node --input-type=module -e 'import {pathToFileURL} from "node:url"; const {chromium}=await import(pathToFileURL(process.env.OPENCLAW_PACKAGE_DIR+"/node_modules/playwright-core/index.mjs").href); console.log("CHROMIUM_PATH="+chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Test Python, Node, OpenClaw SDK and dashboard
        env:
          THE_MACHINE_TEST_TIMEOUT: ${{ runner.os == 'Windows' && '240' || '' }}
          # Native Windows fixtures derive message keys repeatedly; avoid four competing crypto-heavy suites.
          THE_MACHINE_TEST_JOBS: ${{ runner.os == 'Windows' && '2' || '' }}
        run: python scripts/test.py
      - name: Installer dry run
        run: python installer.py --dry-run
      - name: Windows installer dry run
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -DryRun

  secrets:
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON(vars.CI_PR_RUNNER || '["self-hosted","linux","themachine-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all reachable history with Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error "$base/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all --no-banner
