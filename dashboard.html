<script>// The mobile app (its WebView says TheMachineApp/<n>): nothing that leads to buying is shown in it ([data-buy]).
if(/ TheMachineApp\/\d/.test(navigator.userAgent))document.documentElement.classList.add('in-app');
// The to-dos are what the page waits on: their request starts here, beside the page's own script, not after it has run
// (shell-network.js statusFirst takes the answer). A failed one is asked again there.
var statusEarly=fetch('api/status',{redirect:'manual'}).catch(()=>null);
// Older browsers (an Android System WebView before Chrome 92 lacks .at, findLast, crypto.randomUUID): the few newer
// built-ins the page uses, filled in only where missing. tests/test_dashboard_compat.py keeps the rest of the page off newer ones.
(()=>{const def=(o,k,f)=>{if(o&&!(k in o))Object.defineProperty(o,k,{value:f,writable:true,configurable:true})};
const at=function(i){i=Math.trunc(i)||0;if(i<0)i+=this.length;return i<0||i>=this.length?undefined:this[i]};
for(const c of [Array,String,Object.getPrototypeOf(Int8Array)])def(c.prototype,'at',at);
def(Array.prototype,'findLastIndex',function(f,t){for(let i=this.length-1;i>=0;i--)if(f.call(t,this[i],i,this))return i;return-1});
def(Array.prototype,'findLast',function(f,t){const i=this.findLastIndex(f,t);return i<0?undefined:this[i]});
for(const c of [Element,DocumentFragment])def(c.prototype,'replaceChildren',function(...k){this.textContent='';this.append(...k)});
def(Element.prototype,'checkVisibility',function(){return this.getClientRects().length>0});
if(window.crypto?.getRandomValues)def(crypto,'randomUUID',()=>{const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;
 const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return`${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`})})();
// Theme: light or dark as picked here or in the hosted app (the "theme" cookie, shared under the app's domain), else the device's own setting.
(()=>{const root=document.documentElement,sys=matchMedia('(prefers-color-scheme: light)');
const saved=()=>{const c=document.cookie.match(/(?:^|;\s*)theme=(light|dark)(?:;|$)/);if(c)return c[1];const l=localStorage.getItem('theme');return l==='light'||l==='dark'?l:'auto'};
// On Omarchy, the dashboard follows the computer's Omarchy theme instead (settings-omarchy.js; on by default on that
// computer itself): its mode and colors from the copy kept here, so the first paint already has them.
const omarchy=()=>{try{const p=['1','auto'].includes(localStorage.getItem('omarchy-theme'))&&JSON.parse(localStorage.getItem('omarchy-palette'));return p&&p.colors?p:null}catch{return null}};
// The theme's colors onto the dashboard's tokens (base-tokens.css), in the style of the page itself; null takes them off.
// Colors are #rrggbb only (machine/omarchy.py); a light theme gets near-white cards, as the dashboard's own light mode.
let painted=[];window.paintOmarchy=o=>{const s=root.style;for(const n of painted)s.removeProperty(n);painted=[];delete root.dataset.omarchy;if(!o)return;
 const c=o.colors,fg=c.foreground,bg=c.background,mix=(a,p,b='transparent')=>`color-mix(in srgb,${a} ${p}%,${b})`,
  surface=o.mode==='light'?mix('#fff',60,bg):mix(fg,5,bg),raised=o.mode==='light'?mix('#fff',80,bg):mix(fg,9,bg),sunken=c.dark_background||mix(fg,3,bg),
  orange=c.orange||c.red||c.accent,amber=c.yellow||orange,link=c.blue||c.accent,second=c.magenta||link;
 const v={'--c-bg':bg,'--c-surface':surface,'--c-raised':raised,'--c-sunken':sunken,'--c-line':mix(fg,10),'--c-line-strong':mix(fg,18),
  '--c-text':fg,'--c-text-2':mix(fg,78,bg),'--c-text-3':mix(fg,60,bg),'--c-accent':c.accent,'--c-accent-hover':mix(c.accent,85,fg),'--c-accent-ink':bg,
  '--c-accent-tint':mix(c.accent,17,surface),'--c-amber':amber,'--c-orange':orange,'--c-lavender':second,'--c-hover':mix(fg,6),
  '--mint':c.accent,'--cream':fg,'--amber':amber,'--orange':orange,'--lavender':link,'--lavender-light':mix(link,70,fg),'--night-lavender':c.muted||mix(fg,40,bg),
  '--charcoal':bg,'--screen':sunken,'--bg':bg,'--surface':surface,'--surface-2':raised,'--sunken':sunken,'--border':mix(fg,14),'--border-strong':mix(fg,26),
  '--text':fg,'--muted':mix(fg,85,bg),'--faint':mix(fg,65,bg)};
 for(const k in v)s.setProperty(k,v[k]);painted=Object.keys(v);root.dataset.omarchy=o.name||'omarchy'};
const pick=()=>{const m=saved(),o=omarchy(),t=o?o.mode:m==='auto'?(sys.matches?'light':'dark'):m;root.dataset.theme=t;root.dataset.themeMode=o?'omarchy':m;window.paintOmarchy(o);document.querySelector('meta[name=theme-color]')?.setAttribute('content',o?o.colors.background:t==='light'?'#f8f7f3':'#1b1c1f');
// On an iPhone home-screen app the page is drawn under the status bar in dark (white text), and iOS's light bar is used in light.
let sb=document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');if(!sb){sb=document.createElement('meta');sb.name='apple-mobile-web-app-status-bar-style';document.head.appendChild(sb)}sb.content=t==='light'?'default':'black-translucent'};
// On a hosted dashboard (<name>.app.example) the cookie goes on the app's domain, so the app's pages follow; else on this host only.
// Every other copy this page can see goes first: this host's own, and one on a domain above it (a dashboard at
// my.example leaves one on example, which <name>.app.example sees too). With two that disagree the first one read
// wins, so the switch looked stuck.
window.chooseTheme=t=>{try{localStorage.setItem('theme',t)}catch{}const h=location.hostname,labels=h.split('.'),parent=labels.slice(1).join('.'),ip=/^[\d.]+$/.test(h)||h.includes(':'),
sec=location.protocol==='https:'?'; Secure':'',base=`theme=${t}; Path=/; Max-Age=31536000; SameSite=Lax${sec}`,gone='theme=; Path=/; Max-Age=0; SameSite=Lax'+sec;
document.cookie=gone;if(!ip)for(let i=0;i<labels.length-1;i++)document.cookie=gone+'; Domain='+labels.slice(i).join('.');
if(parent.includes('.')&&!ip)document.cookie=base+'; Domain='+parent;if(!document.cookie.includes('theme='+t))document.cookie=base;pick()};
try{if(localStorage.getItem('side')==='collapsed')root.dataset.side='collapsed'}catch{}window.applyTheme=pick;pick();sys.addEventListener('change',pick);document.addEventListener('visibilitychange',()=>{if(!document.hidden){pick();window.showTheme?.()}})})();</script>
