[package]
name = "the-machine-desktop"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
# Adds http://127.0.0.1:<port> as a Machine address, for scripts/sandbox.sh, and a stand-in for the account's sign-in
# (MACHINE_SANDBOX_ACCOUNT). Never in a build for people.
sandbox = []

[build-dependencies]
tauri-build = "2.7"

[dependencies]
tauri = { version = "2.12", features = ["custom-protocol"] } # the pages are in the program
tauri-plugin-deep-link = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }
url = "2"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"
soup = { package = "soup3", version = "0.5" } # as webkit2gtk's
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] } # as Tauri's
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = { version = "0.13", features = ["screensaver"] }
zbus = "5"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
webview2-com = "0.39" # as Tauri's
windows = { version = "0.62", features = [
    "Data_Xml_Dom", "Foundation", "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging", "UI_Notifications",
] }
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSAlert", "NSApplication", "NSButton", "NSColor", "NSControl", "NSEvent", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSTextField", "NSTrackingArea",
    "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSGeometry", "NSKeyValueObserving", "NSNotification", "NSObject", "NSOperation", "NSString", "NSValue", "NSURL", "objc2-core-foundation",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std", "block2", "bitflags", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter",
] }

[dev-dependencies]
png = "0.18"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "debuginfo" # the names stay: hangs.log tells with them where it waits
