[package]
name = "the-machine-desktop"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
# Adds http://127.0.0.1:<port> as a Machine address, for scripts/sandbox.sh, and a stand-in for the account's sign-in
# (MACHINE_SANDBOX_ACCOUNT). Never in a build for people.
sandbox = []

[build-dependencies]
tauri-build = "2.7"

[dependencies]
tauri = { version = "2.12", features = ["custom-protocol"] } # the pages are in the program
tauri-plugin-deep-link = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }
url = "2"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
x11rb = "0.13"
zbus = "5"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
png = "0.18"

[dev-dependencies]
png = "0.18"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
