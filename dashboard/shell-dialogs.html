<dialog id="snooze-dialog" aria-labelledby="snooze-title"><form method="dialog"><div class="snooze-heading"><h2 id="snooze-title">Remind me later</h2><button aria-label="Close picker">×</button></div><div id="snooze-quick"><div class="snooze-presets"><button type="button" data-snooze="2h">2 hours</button><button type="button" data-snooze="tomorrow">Tomorrow · 9:00</button><button type="button" data-snooze="3d">3 days · 9:00</button><button type="button" data-snooze="1w">1 week · 9:00</button></div><button type="button" id="snooze-custom">Choose date</button></div><div id="snooze-calendar" hidden><div class="month-nav"><button type="button" id="month-prev" aria-label="Previous month">‹</button><strong id="snooze-month" aria-live="polite"></strong><button type="button" id="month-next" aria-label="Next month">›</button></div><div class="month-grid" id="snooze-days" aria-label="Choose a day"></div><div class="snooze-time-row"><label for="snooze-time">Time</label><input id="snooze-time" type="time" required></div><small id="snooze-zone"></small><div class="snooze-footer"><button id="snooze-back" type="button">Back</button><button id="snooze-save" type="button" class="primary">Save time</button></div></div><p id="snooze-error" class="error" role="alert"></p></form></dialog>
<dialog id="skill-update" aria-labelledby="skill-update-title"><form method="dialog"><div class="snooze-heading"><h2 id="skill-update-title"></h2><button aria-label="Close">×</button></div></form><p id="skill-update-from" class="fine"></p><div class="skill-ba" id="skill-update-ba"></div><p id="skill-update-error" role="status"></p><div class="actions"><button type="button" class="primary" id="skill-update-ok">Update skill</button><button type="button" class="ghost" id="skill-update-cancel">Cancel</button></div></dialog>
<dialog id="skill-look" aria-labelledby="skill-look-title"><form method="dialog"><div class="snooze-heading"><h2 id="skill-look-title"></h2><button aria-label="Close">×</button></div></form><p id="skill-look-from" class="fine"></p><ul id="skill-look-notes" class="skill-notes"></ul><pre id="skill-look-body" class="skill-body"></pre><p id="skill-look-error" role="status"></p><div class="actions" id="skill-look-actions"></div></dialog>
