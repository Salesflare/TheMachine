><dialog id="signin-dialog" aria-labelledby="signin-title"><form method="dialog"><div class="snooze-heading"
><h2 id="signin-title">Sign in</h2><button aria-label="Close sign-in">×</button></div></form
><form id="signin-form" autocomplete="off"
><label id="signin-pick" hidden>Page<select id="signin-page"></select></label
><p id="signin-saved" hidden
><button type="button" id="signin-use-saved" class="primary"></button></p
><label id="signin-user-row">Username or email<input id="signin-user" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="1000"></label
><label id="signin-pass-row">Password<input id="signin-pass" type="password" autocomplete="new-password" maxlength="1000"></label
><div id="signin-code-row"
><p id="signin-code-help" class="signin-help" hidden></p
><p id="signin-code-ask" class="signin-ask" hidden></p><label
><span id="signin-code-label">One-time code</span
><input id="signin-code" inputmode="numeric" autocomplete="one-time-code" maxlength="100"></label
><div id="signin-others" class="signin-others" hidden></div></div
><label id="signin-save-row" class="signin-check"
><input type="checkbox" id="signin-save"> Save for next time</label
><p id="signin-status" class="signin-status" role="status" hidden><span class="spin" aria-hidden="true"></span
><span id="signin-status-text"></span></p
><div id="signin-view" class="signin-view" hidden><div class="signin-view-bar"
><button type="button" id="signin-full" aria-pressed="false">Full size</button></div
><iframe id="signin-frame" title="The browser"></iframe></div
><p id="signin-error" role="alert"></p
><p id="signin-home" class="signin-home" hidden><a id="signin-home-link" target="_blank" rel="noopener">Sign in from your home connection</a> <span class="signin-home-time">About 10 min to set up</span></p><div class="actions"
><button id="signin-go" class="primary">Sign in</button
><button type="button" id="signin-browser" class="ghost">Open the browser</button
><button type="button" id="signin-retry" class="ghost" hidden>Try again</button
><button type="button" id="signin-continue" class="ghost" hidden>Continue</button></div
><p class="fine" id="signin-fine">This goes straight into the page in your Machine’s browser. The assistant never sees it. For anything else, open the browser.</p></form></dialog>
